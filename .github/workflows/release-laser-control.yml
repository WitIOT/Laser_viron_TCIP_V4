name: Build & Release Laser Control

# push tag vX.Y.Z -> build .exe + zip + installer -> publish GitHub Release
# โค้ดและ release อยู่ repo เดียวกัน (Laser_viron_TCIP_V4) จึงใช้ GITHUB_TOKEN
# ในตัว ไม่ต้องตั้ง PAT/secret เพิ่ม

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # ให้ GITHUB_TOKEN สร้าง release ได้

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derive version from tag
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Building version $ver"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Get-Content version.py)    -replace '__version__ = ".*"',       "__version__ = `"$ver`""       | Set-Content version.py    -Encoding utf8
          (Get-Content installer.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" | Set-Content installer.iss -Encoding utf8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean LaserControl.spec

      - name: Zip build (for auto-update)
        run: |
          New-Item -ItemType Directory -Force release_assets | Out-Null
          Compress-Archive -Path dist/LaserControl -DestinationPath "release_assets/LaserControl-v$env:APP_VERSION.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Automated build of Laser Control ${{ github.ref_name }}

            - `LaserControl-v${{ env.APP_VERSION }}.zip` — สำหรับ auto-update
            - `LaserControl-Setup-${{ env.APP_VERSION }}.exe` — installer ติดตั้งครั้งแรก
          files: |
            release_assets/LaserControl-v${{ env.APP_VERSION }}.zip
            installer_output/LaserControl-Setup-${{ env.APP_VERSION }}.exe
